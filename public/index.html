<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Progressive Web App</title>
  <!-- Link til manifest-fil -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Velkommen til min PWA!</h1>
  <p>Denne siden er nå en del av en PWA.</p>
  
  <!-- Registrer service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(registration) {
          console.log('Service Worker registrert med scope:', registration.scope);
        }, function(error) {
          console.log('Service Worker registrering feilet:', error);
        });
      });
    }
  </script>
</body>
</html>
